<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&amp;D Companion</title>
    <!-- The toolbar button's popover in Owlbear Rodeo: opens the companion panel, then offers where to dock it.
         Colours follow Owlbear's theme (set by the script); these are the dark-theme fallbacks. -->
    <style>
      :root {
        --paper: #222639;
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.7);
        --primary: #bb99ff;
        --line: rgba(255, 255, 255, 0.14);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--text);
        background: transparent;
      }
      [hidden] { display: none !important; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .label { color: var(--muted); }
      .segment { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .segment button { border: 0; background: none; color: var(--text); padding: 4px 11px; font: inherit; cursor: pointer; }
      .segment button[aria-pressed='true'] { background: var(--primary); color: #000; font-weight: 600; }
      .close {
        width: 100%; margin-top: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 8px;
        background: none; color: var(--text); font: inherit; cursor: pointer;
      }
      .close:hover, .segment button:hover:not([aria-pressed='true']) { background: var(--line); }
      .hint { margin: 8px 0 0; font-size: 11px; color: var(--muted); }
      .loading { display: flex; gap: 12px; align-items: flex-start; padding-top: 6px; }
      .loading strong { display: block; margin-bottom: 4px; }
      .loading span { color: var(--muted); font-size: 12px; }
      .spinner {
        flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%;
        border: 3px solid var(--line); border-top-color: var(--primary); animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Shown at once, before the SDK has loaded: opening the companion takes a moment, and a second
         click on the toolbar button would close this popover and cancel it. -->
    <div id="loading" class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <div role="status"><strong></strong><span></span></div>
    </div>
    <script>
      // Inline so it shows before the module loads; same language choice as `action.ts`.
      ;(() => {
        let lang = null
        try { lang = localStorage.getItem('dnd-companion-lang') } catch {}
        const de = lang ? lang === 'de' : navigator.language.toLowerCase().startsWith('de')
        const [title, hint] = de
          ? ['Companion wird geöffnet …', 'Bitte einen Moment warten und nicht erneut auf das Symbol klicken.']
          : ['Opening the companion …', 'Please wait a moment and don’t click the icon again.']
        document.querySelector('#loading strong').textContent = title
        document.querySelector('#loading span').textContent = hint
      })()
    </script>
    <div id="controls" hidden>
      <div class="row">
        <span class="label" data-t="owlbear.dockLabel"></span>
        <span class="segment">
          <button type="button" data-side="left" data-t="owlbear.dockLeft"></button>
          <button type="button" data-side="right" data-t="owlbear.dockRight"></button>
        </span>
      </div>
      <div class="row">
        <span class="label" data-t="owlbear.sizeLabel"></span>
        <span class="segment">
          <button type="button" data-size="narrow" data-t="owlbear.sizeNarrow"></button>
          <button type="button" data-size="wide" data-t="owlbear.sizeWide"></button>
        </span>
      </div>
      <button type="button" class="close" id="close" data-t="owlbear.closePanel"></button>
      <p class="hint" data-t="owlbear.reloadHint"></p>
    </div>
    <script type="module" src="/src/owlbear/action.ts"></script>
  </body>
</html>
