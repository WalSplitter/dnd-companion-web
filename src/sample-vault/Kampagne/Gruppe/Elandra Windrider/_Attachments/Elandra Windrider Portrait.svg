<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3b3a8f"/>
      <stop offset="0.55" stop-color="#1c1b4d"/>
      <stop offset="1" stop-color="#0b0a22"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5e8c"/>
      <stop offset="1" stop-color="#16304d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcc4"/>
      <stop offset="1" stop-color="#d9b596"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e2"/>
      <stop offset="1" stop-color="#bfb59a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- arcane circle -->
  <circle cx="128" cy="104" r="86" fill="url(#glow)"/>
  <g fill="none" stroke="#9fd4ff" stroke-opacity="0.5">
    <circle cx="128" cy="104" r="78" stroke-width="1.5"/>
    <circle cx="128" cy="104" r="68" stroke-width="0.8" stroke-dasharray="3 5"/>
    <path d="M128 26v10M128 172v10M50 104h10M196 104h10M73 49l7 7M176 152l7 7M73 159l7-7M176 56l7-7" stroke-width="1.5"/>
  </g>

  <!-- hair behind -->
  <path d="M84 96c-6 40-2 88 6 118h76c8-30 12-78 6-118-6-34-82-34-88 0Z" fill="url(#hair)"/>

  <!-- cloak / shoulders -->
  <path d="M40 256c4-46 34-72 88-72s84 26 88 72Z" fill="url(#cloak)"/>
  <path d="M104 186l24 38 24-38" fill="none" stroke="#d8b25a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="128" cy="226" r="6" fill="#d8b25a"/>

  <!-- neck + face -->
  <path d="M114 150h28v36h-28Z" fill="#d9b596"/>
  <path d="M128 60c-26 0-40 22-40 48 0 30 18 52 40 52s40-22 40-52c0-26-14-48-40-48Z" fill="url(#skin)"/>

  <!-- elven ears -->
  <path d="M90 104c-12-8-22-22-26-36 12 6 24 16 30 26Z" fill="#e8c9ab"/>
  <path d="M166 104c12-8 22-22 26-36-12 6-24 16-30 26Z" fill="#e8c9ab"/>

  <!-- hair front -->
  <path d="M86 108c0-36 18-54 42-54s42 18 42 54c-10-18-24-28-42-30-18 2-32 12-42 30Z" fill="url(#hair)"/>

  <!-- eyes, brows, mouth -->
  <path d="M104 106q8-5 16 0M136 106q8-5 16 0" fill="none" stroke="#6b5a45" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="112" cy="114" rx="5" ry="3.2" fill="#2a6fb0"/>
  <ellipse cx="144" cy="114" rx="5" ry="3.2" fill="#2a6fb0"/>
  <path d="M120 140q8 4 16 0" fill="none" stroke="#a8665a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- circlet -->
  <path d="M92 90q36-16 72 0" fill="none" stroke="#d8b25a" stroke-width="3"/>
  <path d="M128 78l5 7-5 7-5-7Z" fill="#9fd4ff" stroke="#d8b25a" stroke-width="1.5"/>

  <!-- spark in hand -->
  <circle cx="200" cy="200" r="14" fill="url(#glow)"/>
  <path d="M200 186l3 10 10 4-10 4-3 10-3-10-10-4 10-4Z" fill="#ffd27a"/>

  <rect x="3" y="3" width="250" height="250" fill="none" stroke="#d8b25a" stroke-width="6" rx="6"/>
</svg>
