<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="D&amp;D Companion">
<!-- The app's emblem (src/components/ArcaneSigil.tsx), exported for the README. -->
<style>
.spin{transform-origin:100px 100px;animation:spin 90s linear infinite}
.spin-rev{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.pulse{transform-origin:100px 100px;animation:pulse 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6;transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){.spin,.spin-rev,.pulse{animation:none}}
</style>
<defs>
<path id="runes" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0"/>
<radialGradient id="glow"><stop offset="0%" stop-color="#a8741a" stop-opacity=".45"/><stop offset="60%" stop-color="#a8741a" stop-opacity=".08"/><stop offset="100%" stop-color="#a8741a" stop-opacity="0"/></radialGradient>
</defs>
<circle class="pulse" cx="100" cy="100" r="98" fill="url(#glow)"/>
<g class="spin" fill="none" stroke="#a8741a">
<circle cx="100" cy="100" r="92" stroke-opacity=".55" stroke-width=".8"/>
<circle cx="100" cy="100" r="74" stroke-opacity=".4" stroke-width=".6"/>
<text fill="#a8741a" stroke="none" font-size="11" letter-spacing="3.2" opacity=".8" font-family="serif"><textPath href="#runes">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚢᚦᚨᚱ</textPath></text>
</g>
<g class="spin-rev" fill="none" stroke="#a8741a">
<circle cx="100" cy="100" r="66" stroke-opacity=".5" stroke-width=".8" stroke-dasharray="2 5"/>
<polygon points="100.00,36.00 145.25,145.25 36.00,100.00 145.25,54.75 100.00,164.00 54.75,54.75 164.00,100.00 54.75,145.25" stroke-opacity=".35" stroke-width=".7"/>
<circle cx="100.00" cy="34.00" r="2.2" fill="#a8741a" stroke="none"/><circle cx="146.67" cy="53.33" r="2.2" fill="#a8741a" stroke="none"/><circle cx="166.00" cy="100.00" r="2.2" fill="#a8741a" stroke="none"/><circle cx="146.67" cy="146.67" r="2.2" fill="#a8741a" stroke="none"/><circle cx="100.00" cy="166.00" r="2.2" fill="#a8741a" stroke="none"/><circle cx="53.33" cy="146.67" r="2.2" fill="#a8741a" stroke="none"/><circle cx="34.00" cy="100.00" r="2.2" fill="#a8741a" stroke="none"/><circle cx="53.33" cy="53.33" r="2.2" fill="#a8741a" stroke="none"/>
</g>
<g fill="none" stroke="#a8741a" stroke-linejoin="round">
<polygon points="100,62 133,81 133,119 100,138 67,119 67,81" stroke-width="2.2" fill="#a8741a" fill-opacity=".1"/>
<polygon points="100,78 119,111 81,111" stroke-width="1.6"/>
<path d="M100,62 L100,78 M133,81 L119,111 M133,81 L100,78 M67,81 L100,78 M67,81 L81,111 M133,119 L119,111 M67,119 L81,111 M100,138 L119,111 M100,138 L81,111" stroke-width="1.1" stroke-opacity=".75"/>
<text x="100" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#a8741a" stroke="none" font-family="Georgia,serif">20</text>
</g>
</svg>
